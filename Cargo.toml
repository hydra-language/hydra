[workspace]
members = [
    "hydrac",
    "crates/driver",
    "crates/errors",
    "crates/lexer",
    "crates/parser",
    "crates/ir",
    "crates/mir",
    "crates/analyzer",
    "crates/codegen",
    "crates/borrowcheck",
    "runtime"
]

[workspace.package]
version = "0.4.1"

[workspace.lints.rust]
non_camel_case_types = "allow"
